name: ci

on:
  push:
    branches: [develop, qa, main]
  pull_request:

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Anexo J -db layout
        run: |
          test -f 01_ddl/V001__create_users_and_roles.sql
          test -f 02_dml/V002__seed_corte2_users.sql
          test -f 03_dcl/V003__table_grants_identity_app.sql
          test -f 05_rollbacks/U001__drop_users_and_roles.sql
          test -f deploy/compose.yml
          ! grep -E "image: postgres" deploy/compose.yml
